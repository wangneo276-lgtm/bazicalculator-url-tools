[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bazicalculator-url-tools"
version = "0.1.0"
description = "Free BaZi calculator: Four Pillars, Day Master, Ten Gods, Five Elements and Luck Pillars with true solar time. Plus Zi Wei Dou Shu, Liu Yao, Mei Hua, Qi Men and the Chinese Almanac."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "wangneo276-lgtm" }]

[project.urls]
Homepage = "https://bazicalculator.pro/"
Repository = "https://github.com/wangneo276-lgtm/bazicalculator-url-tools"

[tool.setuptools.packages.find]
where = ["python"]
include = ["bazicalculator_url_tools*"]
